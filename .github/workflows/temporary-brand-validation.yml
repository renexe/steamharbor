name: Temporary brand integration validation

on:
  push:
    branches:
      - feat/brand-integrated-shell

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (excluding pre-existing brand tool failure)
        run: npm run lint -- --ignore-pattern tools/brand/render_favicon.cjs

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
