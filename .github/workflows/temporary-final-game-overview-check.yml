name: Temporary final game overview check

on:
  push:
    branches:
      - feat/game-overview-vertical-slice

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint excluding known baseline brand tool issue
        run: npm run lint -- --ignore-pattern tools/brand/render_favicon.cjs
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
